# Traduction française de LocReminder.
#
# Les noms à gauche ne changent jamais : ce sont les clés que le code cherche.
# Les éléments entre accolades comme {place} sont remplis par l'application ;
# garde-les, mais tu peux les déplacer dans la phrase.
#
# Ne traduis pas : LocReminder, OpenStreetMap, OpenTopoMap, ni les noms de
# fabricants et de surcouches (Xiaomi, MIUI, HyperOS, Samsung, OnePlus) : ils
# apparaissent en anglais sur le téléphone lui-même.

meta:
  name: Français
  fastlane: fr-FR

